- aid: bitso:juno
  name: Juno API
  description: >-
    Juno is Bitso's programmable-money platform for Mexican peso (MXN) rails and stablecoin operations.
    The API supports account creation, SPEI funding, MXNB stablecoin mint / redeem and on-chain transfer,
    and destination payouts for fintechs operating in Mexico.
